# ============================================================
# Configuration de TEST — utilise H2 (base en mémoire)
# ============================================================
# Ce fichier remplace application.properties pendant mvn test.
# Avantage : les tests ne touchent pas à PostgreSQL.
# H2 est créé au début des tests et supprimé à la fin.

spring.datasource.url=jdbc:h2:mem:dominos_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Désactiver les logs verbeux pendant les tests
logging.level.com.dominos=INFO
logging.level.org.hibernate.SQL=ERROR
