# ============================================================
# Configuration Spring Boot — Dominos Platform
# ============================================================

# --- Nom de l'application ---
spring.application.name=dominos

# --- Connexion PostgreSQL ---
# C'est ici qu'on dit à Spring comment trouver la base de données.
# Format : jdbc:postgresql://<hote>:<port>/<nom_base>
spring.datasource.url=jdbc:postgresql://localhost:5432/dominos_db
spring.datasource.username=dominos_user
spring.datasource.password=dominos_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Configuration JPA / Hibernate ---

# ddl-auto définit ce que Hibernate fait avec les tables au démarrage :
#   create      → supprime et recrée les tables à chaque démarrage (dev uniquement)
#   create-drop → comme create, mais supprime tout à l'arrêt
#   update      → met à jour les tables sans supprimer les données
#   validate    → vérifie que les tables correspondent aux entités, sans modifier
#   none        → ne touche à rien (production)
#
# On utilise "update" en développement : Hibernate crée les tables
# si elles n'existent pas, et les met à jour si les entités changent.
spring.jpa.hibernate.ddl-auto=update

# Affiche les requêtes SQL dans les logs (utile pour déboguer)
spring.jpa.show-sql=true

# Formate le SQL affiché pour qu'il soit lisible
spring.jpa.properties.hibernate.format_sql=true

# Dialecte PostgreSQL — dit à Hibernate quel "langage SQL" utiliser
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Logs ---
# Niveau de log pour nos classes (DEBUG = très verbeux, utile en développement)
logging.level.com.dominos=DEBUG
# Niveau de log pour Hibernate (affiche les requêtes SQL avec paramètres)
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
